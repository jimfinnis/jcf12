<HTML>
<HEAD>
<style>
	body { font-family: arial; background: #f0f0f0; padding: 20px; }
	h1 { font-size: 18px; }
	.question { background: white; border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; }
	.question input.qnum { width: 60px; font-weight: bold; }
	.qtotal { margin-left: 10px; color: #666; }
	.subq { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
	.subq input.letter { width: 30px; }
	.subq input.marks { width: 50px; }
	.part { display: flex; align-items: center; gap: 6px; margin: 4px 0 4px 30px; }
	.part input.numeral { width: 40px; }
	.part input.marks { width: 50px; }
	button { cursor: pointer; }
	#back { display: inline-block; margin-top: 10px; }
</style>
</HEAD>
<BODY>

<h1>Edit marking scheme</h1>
<div id="questions"></div>
<button id="addQuestion">add question</button>
<button id="save">save</button>
<button id="exportFile">save to file</button>
<button id="importFile">load from file</button>
<input type="file" id="fileInput" accept="application/json" style="display:none">
<span id="status"></span>
<div><a id="back" href="index.html">back to marking</a></div>

<script src="scheme.js"></script>
<script src="edit.js"></script>
</BODY>
</HTML>
